packages:
  - "apps/*"
  - "packages/*"
  - "packages/frontend/*"
  - "packages/features/*"
  - "packages/configuration"
  - "packages/configuration/*"

allowBuilds:
  better-sqlite3: true
  cpu-features: true
  ssh2: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: false

# @electron/rebuild resolves node-abi 4.28, which predates Electron 44 and fails
# the native rebuild (cpu-features via ssh2) during packaging.
overrides:
  node-abi: ^4.37.0
