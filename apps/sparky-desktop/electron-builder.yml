appId: com.polterware.sparky
productName: Sparky
electronVersion: 44.4.5
artifactName: Sparky-${version}-${arch}.${ext}
publish: null
afterPack: scripts/sign-mac.cjs
asar: true
asarUnpack:
  - out/renderer/**

directories:
  buildResources: resources
  output: release/${version}

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{test,tests,__tests__}/**"

extraResources:
  - from: ../../dist
    to: .
    filter:
      - sparky

  - from: resources/app-icons
    to: app-icons
  - from: resources/logo
    to: logo
  - from: resources/sounds
    to: sounds
    filter:
      - "*.webm"
  - from: resources/characters
    to: characters
    filter:
      - "*.png"
      - "*.webp"
  - from: native/build/notify.node
    to: native/notify.node

protocols:
  - name: Sparky
    schemes:
      - sparky

mac:
  icon: resources/icon.icns
  minimumSystemVersion: "15.0"
  extendInfo:
    NSMicrophoneUsageDescription: "Sparky uses the microphone to record audio attachments."
  identity: null
  hardenedRuntime: false
  notarize: false
  category: public.app-category.productivity
  target:
    - dmg
    - zip
