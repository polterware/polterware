appId: com.polterware.sparky
productName: Sparky
asar: true

directories:
  buildResources: resources
  output: release/${version}

files:
  - out/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: ../../dist
    to: .
    filter:
      - sparky

  - from: resources/app-icons
    to: app-icons
  - from: resources/logo
    to: logo
  - from: resources/sounds
    to: sounds
    filter:
      - "*.webm"
  - from: native/build/notify.node
    to: native/notify.node

protocols:
  - name: Sparky
    schemes:
      - sparky

mac:
  icon: resources/icon.icns
  minimumSystemVersion: "15.0"
  extendInfo:
    NSMicrophoneUsageDescription: "Sparky uses the microphone to record audio attachments."
  identity: null
  category: public.app-category.productivity
  target:
    - dmg
    - zip
