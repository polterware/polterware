appId: com.polterware.lore
productName: Lore
asar: true

directories:
  buildResources: resources
  output: release/${version}

files:
  - out/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: resources/app-icons
    to: resources/app-icons
    filter:
      - "main.png"
      - "black.png"
      - "white.png"
  - from: ../../dist
    to: .
    filter:
      - polterware
publish:
  - provider: github
    owner: polterware
    repo: polterware

mac:
  identity: null
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/lore.icon
