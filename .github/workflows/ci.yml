name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: (cd schemas && buf lint)
      - run: (cd schemas/vendor/dispatch && buf lint)
      - run: (cd backend && go vet ./...)
      - run: (cd backend && go test ./...)

  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Generated contracts are current
        run: |
          (cd schemas && buf build -o /tmp/descriptor.json#format=json)
          (cd schemas/vendor/dispatch && buf build -o /tmp/dispatch-descriptor.json#format=json)
          cargo run --quiet -p gen-contracts -- /tmp/descriptor.json app/src/contracts --check
          cargo run --quiet -p gen-contracts -- /tmp/dispatch-descriptor.json app/src/dispatch/contracts --client crate::dispatch::Dispatch --check
