name: Sparky

on:
  push:
    branches:
      - sparky-next
      - "sparky/**"
  pull_request:
    paths:
      - "apps/sparky-desktop/**"
      - "apps/sparky-notifier/**"
      - "packages/features/sparky-*/**"
      - "packages/sparky-contracts/**"
      - "packages/frontend/map/**"
      - "sparky/**"
      - "tooling/verify-sparky.sh"
      - "tooling/check-sparky-boundaries.sh"
      - ".github/workflows/sparky.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: sparky/backend/go.mod
          cache-dependency-path: sparky/backend/go.sum

      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@latest

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Generate Sparky contracts
        run: |
          cd sparky/schemas
          buf generate

      - name: verify-sparky
        run: bash tooling/verify-sparky.sh
