name: Sparky release

on:
  push:
    tags:
      - sparky-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing sparky-v<version> tag to build as a draft
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sparky-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/desktop-release.yml
    with:
      app: sparky
      tag: ${{ inputs.tag || github.ref_name }}
