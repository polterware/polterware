[package]
name = "polterware-core"
description = "The Polterware local core: CLI, serve, and MCP, in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "polterware"
path = "src/main.rs"

# Shared dependencies are declared once here so parallel ports do not edit this file.
[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
portable-pty = "0.9"
rand = "0.9"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "preupdate_hook"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# A sibling checkout replaces it through the workspace's .cargo/config.toml [patch].
polterware-mermaid = { git = "https://github.com/polterware/ui" }
unicode-normalization = "0.1"
ureq = { version = "3.5.1", default-features = false }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"
