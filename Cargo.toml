[workspace]
resolver = "3"
members = ["app", "tooling/gen-contracts"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/polterware/polterware"

# Optimize dependencies in dev so UI layout and rendering stay responsive.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
