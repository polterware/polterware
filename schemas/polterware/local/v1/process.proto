syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message ProcessSession {
  string id = 1;
  string project_id = 2;
  string environment_id = 3;
  string command = 4;
  string status = 5;
  string name = 6;
  string node_id = 7;
  int32 pid = 8;
  string started_at = 9;
}
message StartProcessRequest {
  string project_id = 1;
  string environment_id = 2;
  string command = 3;
  repeated string args = 4;
  string cwd = 5;
  string name = 6;
  string node_id = 7;
}
message StartProcessResponse { ProcessSession session = 1; }
message StopProcessRequest { string id = 1; }
message StopProcessResponse { ProcessSession session = 1; }
message GetProcessRequest { string id = 1; }
message GetProcessResponse { ProcessSession session = 1; }
message ListProcessesRequest { string project_id = 1; }
message ListProcessesResponse { repeated ProcessSession sessions = 1; }

service ProcessService {
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
}
