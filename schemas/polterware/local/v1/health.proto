syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message CheckRequest {}
message CheckResponse {
  string status = 1;
  string version = 2;
  double uptime_sec = 3;
}

service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}
