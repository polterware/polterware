syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message CliProvider {
  string id = 1;
  string name = 2;
  string binary = 3;
  repeated string auth_commands = 4;
}
message IntegrationConnection {
  string id = 1;
  string project_id = 2;
  string provider_id = 3;
  string status = 4;
  string label = 5;
}
message ListCliProvidersRequest {}
message ListCliProvidersResponse { repeated CliProvider providers = 1; }
message ListIntegrationConnectionsRequest { string project_id = 1; }
message ListIntegrationConnectionsResponse { repeated IntegrationConnection connections = 1; }
message SaveIntegrationConnectionRequest { IntegrationConnection connection = 1; }
message SaveIntegrationConnectionResponse { IntegrationConnection connection = 1; }

service IntegrationService {
  rpc ListCliProviders(ListCliProvidersRequest) returns (ListCliProvidersResponse);
  rpc ListIntegrationConnections(ListIntegrationConnectionsRequest) returns (ListIntegrationConnectionsResponse);
  rpc SaveIntegrationConnection(SaveIntegrationConnectionRequest) returns (SaveIntegrationConnectionResponse);
}
