syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message Layout {
  string id = 1;
  string project_id = 2;
  int64 revision = 3;
  string body_json = 4;
}

message ArchitectureViewMember {
  string node_id = 1;
  string name = 2;
  string type = 3;
  string layer = 4;
}

message ArchitectureView {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string owner = 5;
  string purpose = 6;
  string notes = 7;
  string filter_summary = 8;
  repeated string environments = 9;
  repeated string tags = 10;
  string updated_at = 11;
  repeated ArchitectureViewMember members = 12;
}

message GetLayoutRequest { string project_id = 1; }
message GetLayoutResponse { Layout layout = 1; }
message UpdateLayoutRequest { string project_id = 1; int64 expected_revision = 2; string body_json = 3; }
message UpdateLayoutResponse { Layout layout = 1; }
message ListViewsRequest { string project_id = 1; }
message ListViewsResponse { repeated ArchitectureView views = 1; }
message SaveViewRequest { ArchitectureView view = 1; }
message SaveViewResponse { ArchitectureView view = 1; }
message DeleteViewRequest { string id = 1; }
message DeleteViewResponse {}

service ArchitectureService {
  rpc GetLayout(GetLayoutRequest) returns (GetLayoutResponse);
  rpc UpdateLayout(UpdateLayoutRequest) returns (UpdateLayoutResponse);
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse);
  rpc SaveView(SaveViewRequest) returns (SaveViewResponse);
  rpc DeleteView(DeleteViewRequest) returns (DeleteViewResponse);
}
