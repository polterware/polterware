syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message Resource {
  string id = 1;
  string project_id = 2;
  string environment_id = 3;
  string name = 4;
  string type = 5;
  string external_key = 6;
  string source = 7;
}

message Layout {
  string id = 1;
  string project_id = 2;
  int64 revision = 3;
  string body_json = 4;
}

message GetLayoutRequest { string project_id = 1; }
message GetLayoutResponse { Layout layout = 1; }
message UpdateLayoutRequest { string project_id = 1; int64 expected_revision = 2; string body_json = 3; }
message UpdateLayoutResponse { Layout layout = 1; }
message ListResourcesRequest { string project_id = 1; }
message ListResourcesResponse { repeated Resource resources = 1; }
message SaveResourceRequest { Resource resource = 1; }
message SaveResourceResponse { Resource resource = 1; }

service ArchitectureService {
  rpc GetLayout(GetLayoutRequest) returns (GetLayoutResponse);
  rpc UpdateLayout(UpdateLayoutRequest) returns (UpdateLayoutResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc SaveResource(SaveResourceRequest) returns (SaveResourceResponse);
}
