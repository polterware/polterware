syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message SubscribeLogsRequest {
  string operation_id = 1;
  string session_id = 2;
  int64 since_sequence = 3;
}

message SubscribeLogsResponse {
  string operation_id = 1;
  string session_id = 2;
  int64 sequence = 3;
  string body = 4;
  bool truncated = 5;
  bool resource_exhausted = 6;
  string at = 7;
}

message QueryLogsRequest {
  string operation_id = 1;
  int32 limit = 2;
}
message QueryLogsResponse {
  repeated SubscribeLogsResponse chunks = 1;
}

service LogService {
  rpc SubscribeLogs(SubscribeLogsRequest) returns (stream SubscribeLogsResponse);
  rpc QueryLogs(QueryLogsRequest) returns (QueryLogsResponse);
}
