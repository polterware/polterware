syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message ResetLocalStoreRequest {}
message ResetLocalStoreResponse { string status = 1; }

message GetStoreHealthRequest {}
message GetStoreHealthResponse {
  bool quarantined = 1;
  string message = 2;
}

service MaintenanceService {
  rpc ResetLocalStore(ResetLocalStoreRequest) returns (ResetLocalStoreResponse);
  rpc GetStoreHealth(GetStoreHealthRequest) returns (GetStoreHealthResponse);
}
