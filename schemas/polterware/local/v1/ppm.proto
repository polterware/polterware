syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message PpmEntity {
  string id = 1;
  string project_id = 2;
  string kind = 3;
  string ref_kind = 4;
  string ref_id = 5;
  string title = 6;
  string truth_class = 7;
  string source = 8;
  string actor = 9;
  string observed_at = 10;
  string created_at = 11;
  string updated_at = 12;
}

message PpmRelationship {
  string id = 1;
  string project_id = 2;
  string subject_entity_id = 3;
  string predicate = 4;
  string object_entity_id = 5;
  string truth_class = 6;
  string source = 7;
  string actor = 8;
  string observed_at = 9;
  string created_at = 10;
}

message ListEntitiesRequest {
  string project_id = 1;
  string kind = 2;
}

message ListEntitiesResponse {
  repeated PpmEntity entities = 1;
}

message ListRelationshipsRequest {
  string project_id = 1;
  string entity_id = 2;
}

message ListRelationshipsResponse {
  repeated PpmRelationship relationships = 1;
}

message GetEntityRequest {
  string id = 1;
}

message GetEntityResponse {
  PpmEntity entity = 1;
}

message SyncProjectModelRequest {
  string project_id = 1;
}

message SyncProjectModelResponse {
  int32 entity_count = 1;
}

service ProjectModelService {
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc ListRelationships(ListRelationshipsRequest) returns (ListRelationshipsResponse);
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  rpc SyncProjectModel(SyncProjectModelRequest) returns (SyncProjectModelResponse);
}
