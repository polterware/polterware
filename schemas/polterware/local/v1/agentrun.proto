syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message AgentRun {
  string id = 1;
  string project_id = 2;
  string task = 3;
  string agent_label = 4;
  string status = 5;
  string created_at = 6;
  string completed_at = 7;
  // actor_kind is "human" or "agent" (B9 Unified Change History).
  string actor_kind = 8;
}

message AgentRunStep {
  string id = 1;
  string agent_run_id = 2;
  string kind = 3;
  string summary = 4;
  string payload_json = 5;
  string created_at = 6;
}

// ChangeEnvelope is required on semantic Desktop mutations (same fields as MCP audited writes).
// agent_run_id is optional for human Desktop writes: the core starts and completes a human run.
message ChangeEnvelope {
  string summary = 1;
  string rationale = 2;
  string agent_run_id = 3;
}

message ListAgentRunsRequest {
  string project_id = 1;
  int32 limit = 2;
}

message ListAgentRunsResponse {
  repeated AgentRun runs = 1;
}

message GetAgentRunRequest {
  string id = 1;
}

message GetAgentRunResponse {
  AgentRun run = 1;
  repeated AgentRunStep steps = 2;
}

message ProjectChange {
  string step_id = 1;
  string agent_run_id = 2;
  string project_id = 3;
  string actor_kind = 4;
  string agent_label = 5;
  string run_status = 6;
  string run_task = 7;
  string summary = 8;
  string payload_json = 9;
  string created_at = 10;
}

message ListChangesRequest {
  string project_id = 1;
  // Optional filter: "human" | "agent". Empty lists both.
  string actor_kind = 2;
  int32 limit = 3;
}

message ListChangesResponse {
  repeated ProjectChange changes = 1;
}

// McpSession is one live MCP client connected to the core (ADR 0007).
message McpSession {
  string id = 1;
  string client_name = 2;
  string client_version = 3;
  string started_at = 4;
  string last_seen_at = 5;
}
message ListMcpSessionsRequest {}
message ListMcpSessionsResponse { repeated McpSession sessions = 1; }

service AgentRunService {
  rpc ListMcpSessions(ListMcpSessionsRequest) returns (ListMcpSessionsResponse);
  rpc ListAgentRuns(ListAgentRunsRequest) returns (ListAgentRunsResponse);
  rpc GetAgentRun(GetAgentRunRequest) returns (GetAgentRunResponse);
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
}
