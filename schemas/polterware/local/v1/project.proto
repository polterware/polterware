syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message Project {
  string id = 1;
  string name = 2;
  string root_path = 3;
  string created_at = 4;
  string updated_at = 5;
}

message Environment {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string kind = 4;
  string protection = 5;
  bool is_default = 6;
  string description = 7;
}

message ProjectSettings {
  string project_id = 1;
  string description = 2;
  string default_environment_id = 3;
  string repository = 4;
}

message ListProjectsRequest {}
message ListProjectsResponse { repeated Project projects = 1; }
message SaveProjectRequest { Project project = 1; }
message SaveProjectResponse { Project project = 1; }
message ListEnvironmentsRequest { string project_id = 1; }
message ListEnvironmentsResponse { repeated Environment environments = 1; }
message SaveEnvironmentRequest { Environment environment = 1; }
message SaveEnvironmentResponse { Environment environment = 1; }
message GetProjectSettingsRequest { string project_id = 1; }
message GetProjectSettingsResponse { ProjectSettings settings = 1; }
message SaveProjectSettingsRequest { ProjectSettings settings = 1; }
message SaveProjectSettingsResponse { ProjectSettings settings = 1; }

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc SaveProject(SaveProjectRequest) returns (SaveProjectResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc SaveEnvironment(SaveEnvironmentRequest) returns (SaveEnvironmentResponse);
  rpc GetProjectSettings(GetProjectSettingsRequest) returns (GetProjectSettingsResponse);
  rpc SaveProjectSettings(SaveProjectSettingsRequest) returns (SaveProjectSettingsResponse);
}
