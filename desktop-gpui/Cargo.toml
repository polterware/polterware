[package]
name = "polterware-gpui"
description = "Polterware, the desktop app, in GPUI."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/polterware/polterware"
publish = false

[[bin]]
name = "polterware-gpui"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
# A sibling checkout replaces it through the workspace's .cargo/config.toml [patch].
polterware-ui = { git = "https://github.com/polterware/ui" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints.rust]
# objc 0.2's msg_send! checks a `cargo-clippy` feature in the calling crate (as Dispatch's).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders", "font-kit", "test-support"] }

# Its own workspace: the repository's other code is Go and TypeScript.
[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
