version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/polterware/polterware/sparky/backend/platform/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../backend/platform/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../backend/platform/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: ../../packages/sparky-contracts/src/gen
    opt:
      - target=ts
