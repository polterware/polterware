syntax = "proto3";

package sparky.v1;

option go_package = "github.com/polterware/polterware/sparky/backend/platform/gen/sparky/v1;sparkyv1";

message CheckRequest {}

message CheckResponse {
  string build = 1;
  string version = 2;
}

service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}
