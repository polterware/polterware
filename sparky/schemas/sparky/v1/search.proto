syntax = "proto3";

package sparky.v1;

option go_package = "github.com/polterware/polterware/sparky/backend/platform/gen/sparky/v1;sparkyv1";

message SearchHit {
  string memory_id = 1;
  string title = 2;
  double score = 3;
  string snippet = 4;
  repeated string matched_in = 5;
}

message SearchMemoriesRequest {
  string query = 1;
  string mode = 2;
  string mind_id = 3;
  bool include_descendants = 4;
  repeated string tag_ids = 5;
  string status = 6;
  int32 limit = 7;
}

message SearchMemoriesResponse {
  repeated SearchHit hits = 1;
  string mode_used = 2;
  string notice = 3;
}

message SearchStatusRequest {}

message SearchStatusResponse {
  int32 fts_documents = 1;
  int32 embeddings_indexed = 2;
  int32 embeddings_pending = 3;
  string embedding_state = 4;
  string embedding_provider = 5;
  string embedding_model = 6;
  int32 embedding_dims = 7;
}

message ReindexRequest {}

message ReindexResponse {
  int32 memories = 1;
}

// ConfigureEmbeddingRequest applies runtime embedding settings.
// api_key is not persisted.
message ConfigureEmbeddingRequest {
  bool enabled = 1;
  string provider = 2;
  string model = 3;
  string base_url = 4;
  string api_key = 5;
}

message ConfigureEmbeddingResponse {
  SearchStatusResponse status = 1;
}

message TestEmbeddingRequest {}

message TestEmbeddingResponse {
  bool ok = 1;
  int32 dims = 2;
  int32 latency_ms = 3;
  string error = 4;
}

service SearchService {
  rpc Search(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  rpc Status(SearchStatusRequest) returns (SearchStatusResponse);
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
  rpc ConfigureEmbedding(ConfigureEmbeddingRequest) returns (ConfigureEmbeddingResponse);
  rpc TestEmbedding(TestEmbeddingRequest) returns (TestEmbeddingResponse);
}
