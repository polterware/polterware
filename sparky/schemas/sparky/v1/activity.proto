syntax = "proto3";

package sparky.v1;

option go_package = "github.com/polterware/polterware/sparky/backend/platform/gen/sparky/v1;sparkyv1";

import "google/protobuf/timestamp.proto";

message ActivityEvent {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  string actor = 3;
  string entity = 4;
  string entity_id = 5;
  string op = 6;
  string summary = 7;
}

message ListActivityRequest {
  string cursor = 1;
  string actor = 2;
  int32 limit = 3;
}

message ListActivityResponse {
  repeated ActivityEvent events = 1;
  string next_cursor = 2;
}

service ActivityService {
  rpc List(ListActivityRequest) returns (ListActivityResponse);
}
