syntax = "proto3";

package sparky.v1;

option go_package = "github.com/polterware/polterware/sparky/backend/platform/gen/sparky/v1;sparkyv1";

import "google/protobuf/timestamp.proto";

// Place is stored and shown on the map. Geofence arming is not part of v1.
message Place {
  string memory_id = 1;
  optional string name = 2;
  double lat = 3;
  double lng = 4;
  optional double radius_m = 5;
  string event = 6;
  optional bool active = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SetPlaceRequest {
  Place place = 1;
  // Memory revision from the caller's last read; 0 or absent means unchecked.
  optional int64 expected_rev = 2;
}

message SetPlaceResponse {
  Place place = 1;
}

message ClearPlaceRequest {
  string memory_id = 1;
  optional int64 expected_rev = 2;
}

message ClearPlaceResponse {}

message ListPlacesInBoundsRequest {
  double south = 1;
  double west = 2;
  double north = 3;
  double east = 4;
}

message ListPlacesInBoundsResponse {
  repeated Place places = 1;
}

service PlaceService {
  rpc Set(SetPlaceRequest) returns (SetPlaceResponse);
  rpc Clear(ClearPlaceRequest) returns (ClearPlaceResponse);
  rpc ListInBounds(ListPlacesInBoundsRequest) returns (ListPlacesInBoundsResponse);
}
