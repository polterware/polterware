syntax = "proto3";

package sparky.v1;

option go_package = "github.com/polterware/polterware/sparky/backend/platform/gen/sparky/v1;sparkyv1";

import "google/protobuf/timestamp.proto";
import "sparky/v1/attachment.proto";
import "sparky/v1/place.proto";
import "sparky/v1/schedule.proto";
import "sparky/v1/tag.proto";

// Memory is the full row plus the relations selected by MemoryInclude.
message Memory {
  string id = 1;
  string mind_id = 2;
  string title = 3;
  string note = 4;
  string status = 5;
  bool pinned = 6;
  optional int32 priority = 7;
  google.protobuf.Timestamp due_at = 8;
  bool due_all_day = 9;
  int32 sort_order = 10;
  bool auto_complete_on_checklist = 11;
  google.protobuf.Timestamp completed_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  int64 rev = 15;
  repeated CheckItem checklist = 16;
  repeated Tag tags = 17;
  Schedule schedule = 18;
  Place place = 19;
  repeated Attachment attachments = 20;
  repeated OccurrenceCompletion completions = 21;
}

message CheckItem {
  string id = 1;
  string memory_id = 2;
  string title = 3;
  string detail = 4;
  bool done = 5;
  int32 sort_order = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CheckItemInput {
  string id = 1;
  string title = 2;
  string detail = 3;
  bool done = 4;
  int32 sort_order = 5;
}

// MemorySummary is the list shape. snippet is at most 120 characters.
message MemorySummary {
  string id = 1;
  string title = 2;
  string status = 3;
  string mind_id = 4;
  google.protobuf.Timestamp due_at = 5;
  bool due_all_day = 6;
  bool pinned = 7;
  optional int32 priority = 8;
  repeated string tag_ids = 9;
  string schedule_label = 10;
  string snippet = 11;
  int64 rev = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp created_at = 14;
  int32 sort_order = 15;
}

// MemoryInclude selects relations for Get. Unset flags omit those relations.
// note false leaves Memory.note empty.
message MemoryInclude {
  bool note = 1;
  bool checklist = 2;
  bool schedule = 3;
  bool place = 4;
  bool attachments = 5;
  bool completions = 6;
  bool tags = 7;
}

message ListMemoriesRequest {
  string mind_id = 1;
  bool include_descendants = 2;
  bool inbox_only = 3;
  string status = 4;
  optional bool pinned = 5;
  repeated string tag_ids = 6;
  google.protobuf.Timestamp due_from = 7;
  google.protobuf.Timestamp due_to = 8;
  google.protobuf.Timestamp updated_from = 9;
  google.protobuf.Timestamp updated_to = 10;
  optional bool has_schedule = 11;
  optional bool has_place = 12;
  string query = 13;
  string order = 14;
  int32 limit = 15;
  string cursor = 16;
}

message ListMemoriesResponse {
  repeated MemorySummary memories = 1;
  string next_cursor = 2;
  int32 total = 3;
}

message GetMemoryRequest {
  string id = 1;
  MemoryInclude include = 2;
}

message GetMemoryResponse {
  Memory memory = 1;
}

message CreateMemoryRequest {
  string mind_id = 1;
  string title = 2;
  string note = 3;
  bool pinned = 4;
  optional int32 priority = 5;
  google.protobuf.Timestamp due_at = 6;
  bool due_all_day = 7;
  int32 sort_order = 8;
  bool auto_complete_on_checklist = 9;
  repeated string tag_ids = 10;
  repeated CheckItemInput checklist = 11;
}

message CreateMemoryResponse {
  Memory memory = 1;
}

message UpdateMemoryRequest {
  string id = 1;
  optional int64 expected_rev = 2;
  optional string title = 3;
  optional string note = 4;
  optional string mind_id = 5;
  bool clear_mind_id = 6;
  optional int32 priority = 7;
  bool clear_priority = 8;
  optional google.protobuf.Timestamp due_at = 9;
  bool clear_due_at = 10;
  optional bool due_all_day = 11;
  optional int32 sort_order = 12;
  optional bool pinned = 13;
  optional bool auto_complete_on_checklist = 14;
}

message UpdateMemoryResponse {
  Memory memory = 1;
}

message DeleteMemoryRequest {
  string id = 1;
  optional int64 expected_rev = 2;
}

message DeleteMemoryResponse {}

message SetMemoryStatusRequest {
  string id = 1;
  string status = 2;
  optional int64 expected_rev = 3;
  google.protobuf.Timestamp occurrence_at = 4;
}

message SetMemoryStatusResponse {
  Memory memory = 1;
}

message SetMemoryPinnedRequest {
  string id = 1;
  bool pinned = 2;
  optional int64 expected_rev = 3;
}

message SetMemoryPinnedResponse {
  Memory memory = 1;
}

message ReorderMemoriesRequest {
  string mind_id = 1;
  repeated string ordered_ids = 2;
}

message ReorderMemoriesResponse {}

message ToggleCheckItemRequest {
  string memory_id = 1;
  string item_id = 2;
  optional bool done = 3;
  optional int64 expected_rev = 4;
}

message ToggleCheckItemResponse {
  CheckItem item = 1;
  Memory memory = 2;
}

message ReplaceChecklistRequest {
  string memory_id = 1;
  optional int64 expected_rev = 2;
  repeated CheckItemInput items = 3;
}

message ReplaceChecklistResponse {
  repeated CheckItem items = 1;
  Memory memory = 2;
}

message SetMemoryTagsRequest {
  string memory_id = 1;
  repeated string tag_ids = 2;
  optional int64 expected_rev = 3;
}

message SetMemoryTagsResponse {
  repeated Tag tags = 1;
  Memory memory = 2;
}

message BulkMemoryActionRequest {
  repeated string ids = 1;
  string action = 2;
  string mind_id = 3;
  repeated string tag_ids = 4;
}

message BulkMemoryItemResult {
  string id = 1;
  bool ok = 2;
  string error = 3;
}

message BulkMemoryActionResponse {
  repeated BulkMemoryItemResult results = 1;
}

service MemoryService {
  rpc List(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc Get(GetMemoryRequest) returns (GetMemoryResponse);
  rpc Create(CreateMemoryRequest) returns (CreateMemoryResponse);
  rpc Update(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc Delete(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc SetStatus(SetMemoryStatusRequest) returns (SetMemoryStatusResponse);
  rpc SetPinned(SetMemoryPinnedRequest) returns (SetMemoryPinnedResponse);
  rpc Reorder(ReorderMemoriesRequest) returns (ReorderMemoriesResponse);
  rpc ToggleCheckItem(ToggleCheckItemRequest) returns (ToggleCheckItemResponse);
  rpc ReplaceChecklist(ReplaceChecklistRequest) returns (ReplaceChecklistResponse);
  rpc SetTags(SetMemoryTagsRequest) returns (SetMemoryTagsResponse);
  rpc BulkAction(BulkMemoryActionRequest) returns (BulkMemoryActionResponse);
}
