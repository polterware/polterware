syntax = "proto3";

package sparky.v1;

option go_package = "github.com/polterware/polterware/sparky/backend/platform/gen/sparky/v1;sparkyv1";

// Settings is the typed settings document.
// Wire keys: appearance.theme, notifications.sound, notifications.allDayTime,
// notifications.snoozeMinutes, focus.work, focus.shortBreak, focus.longBreak,
// focus.cycles, focus.autoContinue, focus.sounds, focus.notifications,
// map.online, map.provider, search.semantic.enabled, search.semantic.provider,
// search.semantic.model, search.semantic.baseUrl, agents.mcpPort,
// agents.mcpEnabled, agents.allowFileAttach, app.keepRunningInBackground,
// links.fetchTitles.
message Settings {
  string appearance_theme = 1;
  string notifications_sound = 2;
  string notifications_all_day_time = 3;
  int32 notifications_snooze_minutes = 4;
  int32 focus_work_min = 5;
  int32 focus_short_break_min = 6;
  int32 focus_long_break_min = 7;
  int32 focus_cycles = 8;
  bool focus_auto_continue = 9;
  bool focus_sounds = 10;
  bool focus_notifications = 11;
  bool map_online = 12;
  string map_provider = 13;
  bool search_semantic_enabled = 14;
  string search_semantic_provider = 15;
  string search_semantic_model = 16;
  string search_semantic_base_url = 17;
  int32 agents_mcp_port = 18;
  bool agents_mcp_enabled = 19;
  bool agents_allow_file_attach = 20;
  bool app_keep_running_in_background = 21;
  bool links_fetch_titles = 22;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message SetSettingsRequest {
  repeated string keys = 1;
  Settings settings = 2;
}

message SetSettingsResponse {
  Settings settings = 1;
}

service SettingsService {
  rpc Get(GetSettingsRequest) returns (GetSettingsResponse);
  rpc Set(SetSettingsRequest) returns (SetSettingsResponse);
}
